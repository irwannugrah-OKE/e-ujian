<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e-Ujian SDIT Ulil Albab Batam</title>
<meta name="description" content="Portal ujian berbasis komputer (CBT) SDIT Ulil Albab Batam">
<style>
  :root{--bg:#f3f7f4;--card:#fff;--ink:#14281d;--muted:#5b6f63;--brand:#0f7a4a;--brand2:#0b5e39;--line:#dde7e1}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1a14;--card:#16241c;--ink:#e6f0ea;--muted:#9db3a6;--brand:#34b37a;--brand2:#2a9466;--line:#25382d}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  main{width:100%;max-width:440px;text-align:center}
  .logo{width:64px;height:64px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;
        font-weight:700;font-size:22px;margin:0 auto 16px}
  h1{font-size:26px;margin:0 0 4px}
  p.sub{margin:0 0 28px;color:var(--muted)}
  .btn{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--ink);background:var(--card);
       border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;transition:transform .1s,border-color .1s}
  .btn:hover{border-color:var(--brand);transform:translateY(-1px)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand2)}
  .btn .ic{font-size:26px;width:36px;text-align:center}
  .btn b{display:block;font-size:17px}
  .btn small{opacity:.8}
  .btn.off{opacity:.5;pointer-events:none}
  footer{margin-top:24px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <img class="logoimg" src="logo.png" alt="Logo SDIT Ulil Albab" style="width:80px;height:auto;display:block;margin:0 auto 16px">
  <h1>e-Ujian</h1>
  <p class="sub">SDIT Ulil Albab Batam</p>

  <a class="btn primary" id="siswa" href="#"><span class="ic">🎓</span><span><b>Masuk Siswa</b><small>Pilih kelas, nama, lalu masukkan token</small></span></a>
  <a class="btn" id="guru" href="#"><span class="ic">👩‍🏫</span><span><b>Masuk Guru</b><small>Akun @sditulilalbabbatam.sch.id</small></span></a>
  <a class="btn" id="admin" href="#"><span class="ic">⚙️</span><span><b>Masuk Admin</b><small>Akun sekolah ber-peran admin</small></span></a>

  <footer>© SDIT Ulil Albab Batam</footer>
</main>
<div id="app" hidden>
  <a id="back" href="#" title="Kembali ke beranda e-Ujian">← Beranda</a>
  <iframe id="frame" title="e-Ujian Siswa" allow="fullscreen; clipboard-write" allowfullscreen></iframe>
</div>
<style>
  #app{position:fixed;inset:0;background:var(--bg)}
  #app[hidden]{display:none}
  #frame{border:0;width:100%;height:100%;display:block}
  #back{position:fixed;left:8px;bottom:8px;z-index:2;font-size:12px;padding:6px 10px;border-radius:999px;
        background:var(--card);color:var(--muted);border:1px solid var(--line);text-decoration:none;opacity:.85}
</style>
<script>
  // Link aplikasi web Apps Script
  var URL_SISWA   = "https://script.google.com/macros/s/AKfycby6OJL5b1l3pgv2zqxjDB-ELT04PkMTARFuvpZfflSfouReMeHHZuhKyDkqbW3pzzp-Dw/exec";
  var URL_SEKOLAH = "https://script.google.com/a/macros/sditulilalbabbatam.sch.id/s/AKfycbxEyYYrF3-cfV_Y1avIQge58zadsJPnS_NzwyvNq1oUECMr1l__Ev1VoByTqTIQb-CNMw/exec";// deployment khusus akun sekolah (untuk Guru & Admin)

  function set(id, url){
    var a = document.getElementById(id);
    if (url) { a.href = url; } else { a.classList.add("off"); a.querySelector("small").textContent = "Segera tersedia"; }
  }
  set("guru",  URL_SEKOLAH ? URL_SEKOLAH + "?page=guru"  : "");
  set("admin", URL_SEKOLAH ? URL_SEKOLAH + "?page=admin" : "");
  // Guru & Admin dibuka di tab baru (login Google tidak bisa di dalam iframe)
  ["guru","admin"].forEach(function(id){ var a=document.getElementById(id); a.target="_blank"; a.rel="noopener"; });

  // Siswa ditampilkan di dalam halaman ini, jadi alamat tetap e-ujian.eraportsdituabatam.my.id
  var app = document.getElementById("app"), frame = document.getElementById("frame"), main = document.querySelector("main");
  function route(){
    var siswa = location.hash === "#siswa";
    if (siswa && !frame.src) frame.src = URL_SISWA;
    app.hidden = !siswa; main.hidden = siswa;
    document.title = siswa ? "e-Ujian Siswa · SDIT Ulil Albab Batam" : "e-Ujian SDIT Ulil Albab Batam";
  }
  document.getElementById("siswa").href = "#siswa";
  document.getElementById("back").addEventListener("click", function(ev){
    ev.preventDefault();
    if (confirm("Kembali ke beranda? Jika sedang ujian, jawaban yang belum dikirim bisa hilang.")) { frame.removeAttribute("src"); location.hash = ""; }
  });
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
